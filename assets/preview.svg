<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- header -->
  <rect x="80" y="56" width="150" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="155" y="78" font-size="15" font-weight="600" fill="#7c3aed" text-anchor="middle">pi extension</text>
  <text x="80" y="140" font-size="50" font-weight="800" fill="#1e1b2e">pi-codemode-guard</text>
  <text x="82" y="180" font-size="25" fill="#6b6580">Repairs LLM-written codemode scripts before they reach the QuickJS sandbox</text>

  <!-- pipeline boxes -->
  <g filter="url(#ds)">
    <rect x="80" y="250" width="300" height="130" rx="18" fill="#ffffff" stroke="#e5e0f5" stroke-width="1.5"/>
    <rect x="460" y="250" width="300" height="130" rx="18" fill="url(#guard)"/>
    <rect x="840" y="250" width="300" height="130" rx="18" fill="#ffffff" stroke="#e5e0f5" stroke-width="1.5"/>
  </g>

  <!-- box 1: LLM -->
  <text x="230" y="306" font-size="30" font-weight="700" fill="#1e1b2e" text-anchor="middle">LLM</text>
  <text x="230" y="338" font-size="17" fill="#8b85a3" text-anchor="middle">fences · JSON ·</text>
  <text x="230" y="360" font-size="17" fill="#8b85a3" text-anchor="middle">missing await</text>

  <!-- box 2: guard -->
  <text x="610" y="300" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">pi-codemode-guard</text>
  <text x="610" y="328" font-size="16" fill="#ece5ff" text-anchor="middle">10 idempotent</text>
  <text x="610" y="350" font-size="16" fill="#ece5ff" text-anchor="middle">compile passes</text>

  <!-- box 3: sandbox -->
  <text x="990" y="306" font-size="30" font-weight="700" fill="#1e1b2e" text-anchor="middle">QuickJS</text>
  <text x="990" y="344" font-size="18" fill="#16a34a" text-anchor="middle">sandbox runs ✓</text>

  <!-- arrows -->
  <line x1="392" y1="315" x2="446" y2="315" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="772" y1="315" x2="826" y2="315" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>

  <!-- chips -->
  <g font-size="15" font-weight="600" fill="#6d28d9">
    <rect x="110" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="185" y="439" text-anchor="middle" dominant-baseline="central">await inject</text>
    <rect x="276" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="351" y="439" text-anchor="middle" dominant-baseline="central">strip fences</text>
    <rect x="442" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="517" y="439" text-anchor="middle" dominant-baseline="central">JSON → JS</text>
    <rect x="608" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="683" y="439" text-anchor="middle" dominant-baseline="central">OpenCode</text>
    <rect x="774" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="849" y="439" text-anchor="middle" dominant-baseline="central">Cloudflare</text>
    <rect x="940" y="420" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="1015" y="439" text-anchor="middle" dominant-baseline="central">TanStack</text>
  </g>

  <!-- footer -->
  <text x="600" y="546" font-size="20" fill="#6b6580" text-anchor="middle">best-effort · idempotent · pure compiler — never blocks a tool call</text>
  <text x="600" y="582" font-size="15" fill="#a39fb8" text-anchor="middle">MIT · TypeScript strict · 152 unit tests · OpenCode · Cloudflare agents · TanStack AI code mode</text>
</svg>
