<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="pi-codemode-guard — Pi extension that compiles LLM codemode scripts before the QuickJS sandbox runs them">
  <!-- Gallery card thumbnail: 16:10, designed to stay readable at a ~168px-wide
       center crop. Dominant element = package name; content inside the centered
       80% safe area; min secondary font 28px. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0d0d12"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- corner labels -->
  <rect x="140" y="120" rx="8" width="300" height="56" fill="#7c3aed" fill-opacity="0.18" stroke="#7c3aed"/>
  <text x="290" y="158" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#c4b5fd">pi extension</text>
  <text x="1460" y="158" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#8b8b9e">pi.dev/packages</text>

  <!-- shield glyph -->
  <g transform="translate(800 320)">
    <path d="M0,-72 L58,-50 L58,4 C58,44 32,66 0,78 C-32,66 -58,44 -58,4 L-58,-50 Z"
          fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa" stroke-width="5"/>
    <path d="M-26,2 L-8,22 L28,-18" fill="none" stroke="#c4b5fd" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- name -->
  <text x="800" y="530" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="104" font-weight="700" fill="#ffffff">pi-codemode-guard</text>

  <!-- tagline -->
  <text x="800" y="614" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" fill="#c9c9d4">Compiles LLM codemode scripts before QuickJS runs them</text>

  <!-- pipeline: broken → guarded → runs -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="30">
    <rect x="330" y="686" width="330" height="72" rx="14" fill="#16161d" stroke="#e5e7eb" stroke-opacity="0.35" stroke-width="2"/>
    <text x="495" y="731" text-anchor="middle" fill="#f87171">fence + no await</text>
    <line x1="676" y1="722" x2="734" y2="722" stroke="#a78bfa" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="746" y="686" width="240" height="72" rx="14" fill="url(#accent)"/>
    <text x="866" y="731" text-anchor="middle" font-weight="700" fill="#ffffff">guard</text>
    <line x1="1002" y1="722" x2="1060" y2="722" stroke="#a78bfa" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="1072" y="686" width="200" height="72" rx="14" fill="#16161d" stroke="#4ade80" stroke-width="3"/>
    <text x="1172" y="731" text-anchor="middle" fill="#4ade80">runs ✓</text>
  </g>

  <!-- install pill -->
  <rect x="360" y="820" rx="14" width="880" height="96" fill="#16161d" stroke="url(#accent)" stroke-width="3"/>
  <text x="800" y="882" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" fill="#a78bfa">$ pi install npm:pi-codemode-guard</text>

  <!-- accent bar -->
  <rect x="360" y="952" width="880" height="10" rx="5" fill="url(#accent)"/>
</svg>
