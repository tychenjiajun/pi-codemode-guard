  <text x="96" y="264" font-family="ui-monospace, Menlo, monospace" font-size="34" fill="#e6e6ef">
    <tspan x="96" dy="0" fill="#f87171">```js</tspan>
    <tspan x="96" dy="1.4em" fill="#f87171">const hits = searchTools("feishu")</tspan>
